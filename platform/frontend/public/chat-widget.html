<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6f8; }
  #chat { display: flex; flex-direction: column; height: 100%; max-width: 420px; margin: 0 auto; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: linear-gradient(135deg, #4f6ef7, #7b5cf0); color: #fff; font-size: 15px; font-weight: 600; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; }
  header .title { flex: 1; }
  #msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 9px 13px; border-radius: 10px; font-size: 14px; line-height: 1.55; word-break: break-word; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #4f6ef7; color: #fff; border-bottom-right-radius: 3px; }
  .msg.bot { align-self: flex-start; background: #f0f1f4; color: #333; border-bottom-left-radius: 3px; }
  .msg.error { align-self: flex-start; background: #fdecec; color: #c0392b; font-size: 13px; }
  footer { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid #eee; background: #fff; }
  #input { flex: 1; border: 1px solid #d9dce3; border-radius: 18px; padding: 8px 14px; font-size: 14px; outline: none; }
  #input:focus { border-color: #4f6ef7; }
  #send { border: none; background: #4f6ef7; color: #fff; border-radius: 18px; padding: 8px 18px; font-size: 14px; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: not-allowed; }
  .hint { text-align: center; color: #a8aab3; font-size: 12px; padding: 4px 0 2px; }
</style>
</head>
<body>
<div id="chat">
  <header>
    <span class="dot"></span>
    <span class="title" id="title">AI 助手</span>
  </header>
  <main id="msgs"></main>
  <div class="hint">内容由 AI 生成，仅供参考</div>
  <footer>
    <input id="input" placeholder="输入问题…" autocomplete="off" maxlength="2000" aria-label="消息内容">
    <button id="send" type="button">发送</button>
  </footer>
</div>

<script>
(function () {
  const q = new URLSearchParams(location.search);
  const channelId = q.get('channelId') || '';
  const siteKey = q.get('siteKey') || '';
  const apiBase = q.get('apiBase') || '';
  const title = q.get('title') || 'AI 助手';
  const siteOrigin = (() => {
    try {
      if (location.ancestorOrigins && location.ancestorOrigins.length) return location.ancestorOrigins[0];
      if (document.referrer) return new URL(document.referrer).origin;
      return window.parent === window ? location.origin : '';
    } catch { return ''; }
  })();

  if (!channelId || !siteKey) {
    document.getElementById('msgs').innerHTML = '<div class="msg error">嵌入代码无效，请从渠道接入页重新复制</div>';
    return;
  }
  if (!siteOrigin) {
    document.getElementById('msgs').innerHTML = '<div class="msg error">无法识别当前网站来源，请确认浏览器未禁用 Referrer</div>';
    return;
  }
  document.getElementById('title').textContent = title;

  // 访客 ID：localStorage 持久（按站点隔离）
  let conversationId;
  let visitorId = localStorage.getItem('chat_visitor_id');
  if (!visitorId) {
    visitorId = (crypto.randomUUID ? crypto.randomUUID() : 'v-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10));
    localStorage.setItem('chat_visitor_id', visitorId);
  }

  const msgs = document.getElementById('msgs');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  function append(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
  }

  async function send() {
    const content = input.value.trim();
    if (!content) return;
    input.value = '';
    sendBtn.disabled = true;
    append('user', content);
    const pending = append('bot', '…');
    try {
      const res = await fetch((apiBase || '') + '/api/v1/public/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ channelId, siteKey, siteOrigin, visitorId, content, conversationId }),
      });
      const json = await res.json().catch(() => ({}));
      if (json.data?.conversationId) conversationId = json.data.conversationId;
      if (json.code === 0 && json.data?.answer) {
        pending.textContent = json.data.answer;
      } else if (json.data?.answer) {
        pending.textContent = json.data.answer;
      } else if (json.data?.reason === 'robot_not_published') {
        pending.textContent = '机器人尚未发布，请联系管理员';
        pending.className = 'msg error';
      } else {
        pending.textContent = (typeof json.message === 'string' ? json.message : '机器人未响应，请稍后重试');
        pending.className = 'msg error';
      }
    } catch (e) {
      pending.textContent = '网络异常，请稍后重试';
      pending.className = 'msg error';
    }
    sendBtn.disabled = false;
    input.focus();
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
  input.focus();
  append('bot', '你好，我是 ' + title + '，有什么可以帮你？');
})();
</script>
</body>
</html>
