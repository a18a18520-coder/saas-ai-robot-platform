# 本地开发基础设施（PG + Redis）——Dify 自建私有化单独部署（ADR-002）
services:
  postgres:
    image: postgres:16
    container_name: robot-pg
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robot -d robot_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: robot
      POSTGRES_PASSWORD: robot
      POSTGRES_DB: robot_platform
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: robot-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
